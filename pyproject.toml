[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "UP042"]

[tool.ruff.lint.per-file-ignores]
# load_dotenv() must run before importing gateway/agent modules, since
# ChatAnthropic and anthropic.Anthropic read env vars directly at import time.
"gateway/main.py" = ["E402"]
# Deliberate re-export packages — the whole point of these __init__.py
# files is to expose names that aren't otherwise used in the file itself.
"db/__init__.py" = ["F401"]
"tools/__init__.py" = ["F401"]

[tool.black]
line-length = 100
target-version = ["py312"]
